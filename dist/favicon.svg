<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Glass Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#111c35" />
      <stop offset="55%" stop-color="#060913" />
      <stop offset="100%" stop-color="#020307" />
    </radialGradient>

    <!-- Glowing Cyber Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#3b82f6" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.85" />
    </linearGradient>

    <!-- Left Wing Gradient: Electric Cyan to Sky Blue -->
    <linearGradient id="leftWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Right Wing Gradient: Cobalt Blue to Indigo -->
    <linearGradient id="rightWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Center Chevron Gradient: Supernova White-Cyan -->
    <linearGradient id="chevronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base with Cyber Neon Border -->
  <rect x="7" y="7" width="106" height="106" rx="26" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.2" />

  <!-- Background Tech Accents -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="rgba(56, 189, 248, 0.12)" stroke-width="1.2" stroke-dasharray="4 6" />
  <path d="M 17 60 L 27 60 M 93 60 L 103 60 M 60 17 L 60 25 M 60 95 L 60 103" stroke="rgba(56, 189, 248, 0.22)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Main Cyber 'A' Inscription -->
  <g filter="url(#neonGlow)">
    <!-- Left Facet Wing -->
    <path d="M 60 20 
             L 24 88 
             L 39 88 
             L 51 63 
             L 60 44 Z" 
          fill="url(#leftWing)" />

    <!-- Right Facet Wing -->
    <path d="M 60 20 
             L 60 44 
             L 69 63 
             L 81 88 
             L 96 88 Z" 
          fill="url(#rightWing)" />

    <!-- Glowing Cyber Delta Crossbar -->
    <path d="M 36 68 
             L 60 52 
             L 84 68 
             L 60 60 Z" 
          fill="url(#chevronGrad)" />

    <!-- Center Floating Energy Core -->
    <polygon points="60,33 66,44 60,41 54,44" fill="#ffffff" />
    
    <!-- Top Apex Cyber Light Point -->
    <circle cx="60" cy="20" r="2.8" fill="#ffffff" />
  </g>
</svg>
